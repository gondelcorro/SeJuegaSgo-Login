<div align="center">
  <img style="margin: auto; margin-top: 50px; height: 75px;" class="mt-3" src="./assets/images/logo_large.png">
</div>
<br/>

<div style="display: flex; justify-content: center;">
  <mat-card class="example-card">
    <mat-card-content>
      <div class="example-container">
        <div style="text-align: center;">
          <h1 style="font-size: 24px;">Iniciar Sesión</h1>
        </div>
        <br/>
        <mat-form-field style="margin-bottom: 10px">
          <input matInput placeholder="Usuario" [(ngModel)]="usuario" autofocus required>
          <mat-hint>
            Ingrese su correo electrónico.
          </mat-hint>
          <mat-icon matSuffix>email</mat-icon>
        </mat-form-field>
        <mat-form-field>
          <mat-label>Contraseña</mat-label>
          <input matInput [(ngModel)]="clave" [type]="hide ? 'password' : 'text'" required>
          <mat-hint>
            Ingrese su contraseña.
          </mat-hint>
          <button mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'"
                  [attr.aria-pressed]="hide">
            <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
        </mat-form-field>
        <br/>
        <br/>
        <button mat-raised-button color="primary" (keyup.enter)="iniciarSesion()"
                (click)="iniciarSesion()">iniciar Sesion</button>
      </div>
    </mat-card-content>
    <br/>
  </mat-card>
</div>
<div align="center">
  <a [href]=url_recuperarClave>¿Olvidaste tu contraseña?</a>
  <br>
  <a [href]=url_registro>Registrarme</a>
</div>
